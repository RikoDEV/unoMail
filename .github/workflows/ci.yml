name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly dependency audit, so new advisories surface even without code changes.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  acme:
    # Certificate issuance against Pebble, Let's Encrypt's test CA.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: |
          # HTTP-01: Pebble validates against the test's listener on the runner (port 5002).
          docker run -d --name pebble -p 14000:14000 -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=0 \
            --add-host host.docker.internal:host-gateway ghcr.io/letsencrypt/pebble:latest
          # DNS-01: a second Pebble resolving through the challenge test DNS server.
          # Authorization reuse is off, so every order really goes through the DNS provider.
          docker network create acme
          docker run -d --name challtestsrv --network acme -p 8055:8055 ghcr.io/letsencrypt/pebble-challtestsrv:latest \
            -http01 "" -https01 "" -tlsalpn01 "" -doh ""
          docker run -d --name pebble-dns --network acme -p 14001:14000 -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=0 -e PEBBLE_AUTHZREUSE=0 \
            ghcr.io/letsencrypt/pebble:latest -config /test/config/pebble-config.json -dnsserver challtestsrv:8053
          sleep 3
          docker cp pebble:/test/certs/pebble.minica.pem "$RUNNER_TEMP/pebble-root.pem"
          echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - run: cargo test --locked --test acme_live -- --ignored
        working-directory: server
        env:
          UNOMAIL_PEBBLE_ROOT: ${{ runner.temp }}/pebble-root.pem

  ldap:
    # Address book lookups against a real LDAP directory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: |
          docker run -d --name ldap -p 10389:10389 ghcr.io/rroemhild/docker-test-openldap:master
          for i in $(seq 1 30); do docker logs ldap 2>&1 | grep -q "slapd starting" && break; sleep 2; done
      - run: cargo test --locked --test ldap_live -- --ignored
        working-directory: server

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: web
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - run: pnpm test
        working-directory: e2e

  audit:
    # Known-vulnerability scan of every dependency tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: server
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm audit --prod
        working-directory: web
      - run: pnpm audit
        working-directory: e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull --no-cache -t unomail:ci .
      - name: Scan runtime packages and application dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: unomail:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          scanners: vuln
      - name: Record image software inventory
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: unomail:ci
          format: cyclonedx
          output: unomail-sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: unomail-sbom
          path: unomail-sbom.json
