name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.2.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    # The tagged commit must have passed CI on main; the release does not test it again.
    # Builds start right away, only publishing waits for this.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          # CI for the commit may still be running when the tag is pushed right after it.
          for i in $(seq 1 60); do
            run=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$sha" --event push               --json status,conclusion,url --jq 'first // empty')
            [ -z "$run" ] && { echo "::error::No CI run on main for $sha; push the commit to main first."; exit 1; }
            status=$(jq -r .status <<< "$run")
            if [ "$status" = completed ]; then
              conclusion=$(jq -r .conclusion <<< "$run")
              echo "CI for $sha: $conclusion ($(jq -r .url <<< "$run"))"
              [ "$conclusion" = success ] && exit 0
              echo "::error::CI did not pass for $sha"; exit 1
            fi
            sleep 60
          done
          echo "::error::CI for $sha still not finished after an hour"; exit 1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  binaries:
    # Static musl builds on native runners, packaged with the web UI.
    needs: web
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The binary reports the release it was built from (and compares it with newer ones).
      - run: UNOMAIL_VERSION="${TAG#v}" cargo build --release --locked --target ${{ matrix.target }}
        working-directory: server
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist
      - name: Package
        run: |
          name="unomail-$TAG-${{ matrix.target }}"
          mkdir -p "$name/web"
          cp server/target/${{ matrix.target }}/release/unomail server/target/${{ matrix.target }}/release/unomail-p12 "$name/"
          cp -r web-dist/. "$name/web/"
          cp README.md SECURITY.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: unomail-*.tar.gz*

  image:
    # One native build per architecture, pushed by digest and merged into a manifest list below.
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: UNOMAIL_VERSION=${{ env.TAG }}
          pull: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*

  scan:
    # The images are scanned by digest before any tag points at them: a vulnerable build never
    # becomes "latest" or a version tag.
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      # One architecture's result should not cancel the other's scan.
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      # Each digest is an index (image plus build attestation); without this Trivy looks for
      # the runner's own platform in it and fails on the arm64 one.
      TRIVY_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: digest-${{ matrix.arch }}
          path: digests
      - run: echo "REF=ghcr.io/${GITHUB_REPOSITORY,,}@sha256:$(ls digests)" >> "$GITHUB_ENV"
      - name: Scan the built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REF }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          scanners: vuln
      - name: Record image software inventory
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REF }}
          format: cyclonedx
          output: unomail-${{ env.TAG }}-${{ matrix.arch }}-sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.arch }}
          path: unomail-*-sbom.json

  manifest:
    needs: [verify, image, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      - working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

  release:
    needs: [verify, binaries, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          merge-multiple: true
          path: dist
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            prerelease=""
            [[ "$TAG" == *-* ]] && prerelease="--prerelease"
            gh release create "$TAG" dist/* --repo "$REPO" --generate-notes --verify-tag $prerelease
          fi
