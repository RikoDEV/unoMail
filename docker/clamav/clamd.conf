Foreground yes
LogSyslog no
LogTime yes
User clamav
DatabaseDirectory /data/clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketGroup mailfilter
LocalSocketMode 660
# Rspamd and unoMail use the group-restricted Unix socket; no TCP listener.
StreamMaxLength 100M
# Bound the work a single hostile message can cause.
MaxScanSize 100M
MaxFileSize 50M
MaxRecursion 12
MaxFiles 5000
AlertExceedsMax yes
