# cargo-audit configuration.
[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa: "Marvin" timing side channel in private-key operations).
    # The rsa crate generates DKIM key pairs (security/dkim.rs; DKIM signatures themselves are
    # produced by ring) and performs the S/MIME private-key operations (smime.rs): signing a
    # message its owner sends, and decrypting a message its owner reads. The attack needs an
    # oracle: many chosen ciphertexts decrypted on demand, with precise timing of each. Here a
    # decryption happens only when the key's owner opens a message in their own session, with
    # their own key, and its timing is visible to that session only; a sender of crafted
    # messages can neither trigger it nor observe it. OpenPGP encryption at rest uses public
    # keys only. Re-evaluate if that changes or when a fixed release is published.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0367, -0368, -0369 (zip < 9: ZipArchive::extract / ZipStreamReader::extract
    # write symlinks outside the destination and preserve SUID/SGID or apply permissions
    # through symlinks). Our own code uses zip 9. zip 8.6 comes in only through mail-auth 0.13
    # (feature "report"), which opens DMARC and TLS report attachments in memory with
    # ZipArchive::new and reads entries with by_index; it never calls extract or touches the
    # filesystem, so none of the three can be reached. Remove once mail-auth moves to zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
