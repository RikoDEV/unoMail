[package]
name = "unomail"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-only"
default-run = "unomail"

[dependencies]
aes = "0.9"
anyhow = "1.0.104"
arc-swap = "1.9.2"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
bytes = "1.12.1"
cbc = { version = "0.2.1", features = ["alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
cms = { version = "0.2.3", features = ["builder"] }
der = "0.7.10"
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
hickory-resolver = "0.26.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "http1", "http2", "service"] }
idna = "1.1.0"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
ipnet = "2.12.2"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
mail-auth = { version = "0.13.3", default-features = false, features = ["arc", "dns-hickory", "report", "ring"] }
mail-builder = "1.0.0"
mail-parser = "0.11.9"
mime = "0.3.17"
p12-keystore = "0.4.1"
parking_lot = "0.12.5"
pgp = { version = "0.21.0", default-features = false }
quick-xml = "0.42.0"
rand = "0.8.6"
rcgen = "0.14.10"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
ring = "0.17.14"
rrule = "0.14.0"
rsa = { version = "0.9.10", features = ["sha2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103.15", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.20", features = ["io", "codec"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "set-header", "limit", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28.0", features = ["v4"] }
webpki-roots = "1.0.9"
x509-cert = "0.2.5"
x509-parser = { version = "0.18.1", features = ["verify"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rlimit = "0.11"

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"

# Password hashing and RSA key generation are unusably slow without optimizations.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
